        jurisdictions: ["us_federal"]
        effective_date: "2023-01-26"
        pattern_function: "DefconController.transition_to"
        nist_ai_rmf_function: "GOVERN"
        treasury_fs_ai_rmf_controls: ["TFRMF-LG-01", "TFRMF-LG-02", "TFRMF-LG-03"]
