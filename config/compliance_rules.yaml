# compliance_rules.yaml
#
# Source-of-truth mapping from governance patterns to the regulations they satisfy.
# Updates require a PR with a regulatory citation and a test proving the pattern
# function still satisfies the cited clause.
#
# Schema:
#   patterns:
#     <pattern_name>:
#       adr: <ADR number>
#       regulations:
#         - name: <regulation name>
#           statute: <citation>
#           clause: <one-line description>
#           jurisdiction_level: federal | state | municipal | international
#           jurisdictions: [<list of applicable jurisdictions>]
#           effective_date: <YYYY-MM-DD>
#           pattern_function: <code symbol that implements the satisfaction>
#           nist_ai_rmf_function: GOVERN | MAP | MEASURE | MANAGE
#           treasury_fs_ai_rmf_controls: [<list of TFRMF-* control IDs>]
#           last_reviewed: <YYYY-MM-DD>
#
# `nist_ai_rmf_function` maps to NIST AI RMF 1.0 (2023) core functions
# (https://www.nist.gov/itl/ai-risk-management-framework).
#
# `treasury_fs_ai_rmf_controls` maps to the Treasury Financial Services AI Risk
# Management Framework released 2026-02-19 (230 total control objectives).
# Control ID prefixes used here:
#   TFRMF-LG · Lifecycle Governance (§§ 1.1-1.12)
#   TFRMF-DA · Decision Authority + Override (§§ 2.1-2.5)
#   TFRMF-AT · Audit + Traceability (§§ 3.1-3.9)
#   TFRMF-PR · Pre-Production / Promotion Validation (§§ 4.1-4.7)
#   TFRMF-DL · Data Lineage (§§ 5.1-5.4)
#   TFRMF-CF · Compliance + Fairness (§§ 5.5-5.8)
#   TFRMF-DR · Data Residency + Cross-Border (§§ 5.9-5.12)
# The Treasury document's exact section numbering is canonical; these mappings
# are best-effort by ADR and should be validated against the document on every
# annual review.

version: "1.1.0"
last_repo_review: "2026-05-22"
maintainer: "Kunjar Bhaduri"

meta:
  nist_ai_rmf_version: "1.0 (2023-01-26, with 2024-2025 profile extensions)"
  treasury_fs_ai_rmf_version: "1.0 (2026-02-19)"
  notes: |
    Mapping discipline per Gap-Finding G-58 (Memo: Gap_Finding_Synthesis_Report_2026-05-22.md).
    NIST AI RMF + Treasury FS AI RMF 230-control overlay is the credibility anchor for
    Private Capital buyer conversations. Every pattern carries at least one NIST function +
    one Treasury control range.

