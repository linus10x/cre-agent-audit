[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cre-agent-audit"
version = "0.2.2.dev0"
description = "Reference architecture for AI agent governance in commercial real estate operations — Autonomy Ladder™ patterns, MIT-licensed."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Kunjar Bhaduri" }]
keywords = ["ai-governance", "regulated-operations", "commercial-real-estate", "fair-housing", "lease-abstraction", "autonomy-ladder"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
# Zero runtime dependencies.
# YAML is author-time only — see scripts/build_compliance_json.py for the
# checked-in JSON-artifact build pattern. The package's runtime loader
# reads stdlib `json`.
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.4",
  "mypy>=1.8",
  "pyyaml>=6.0",
  "types-pyyaml",
  "build>=1.0",
]

[project.scripts]
cre-replay = "cre_agent_audit.regulatory_replay.cli:main"

[project.urls]
Homepage = "https://autonomy-ladder.io"
Repository = "https://github.com/linus10x/cre-agent-audit"
SiblingRepository = "https://github.com/linus10x/finserv-agent-audit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cre_agent_audit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/cre_agent_audit"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
]
ignore = ["E501"]  # line-too-long handled by formatter

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
