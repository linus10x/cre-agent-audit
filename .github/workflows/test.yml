name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check src/ tests/
      - name: Type check with mypy
        run: mypy src/
      - name: Run pytest
        run: pytest --cov=src --cov-report=term-missing

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run example 01 (lease abstraction provenance)
        run: python examples/01_lease_abstraction_provenance/run.py
      - name: Run example 02 (tenant screening pre-flight)
        run: python examples/02_tenant_screening_preflight/run.py
      - name: Run example 03 (rent optimization sovereign veto)
        run: python examples/03_rent_optimization_sovereign_veto/run.py
