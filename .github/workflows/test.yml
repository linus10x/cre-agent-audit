name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check src/ tests/
      - name: Ruff format check
        run: ruff format --check src/ tests/ scripts/
      - name: Type check with mypy (strict)
        run: mypy --strict src/ tests/
      - name: Run pytest
        run: pytest --cov=src/cre_agent_audit --cov-report=term-missing --cov-fail-under=85
      - name: Verify compliance_rules.json is in sync with .yaml
        run: |
          python scripts/build_compliance_json.py
          git diff --exit-code config/compliance_rules.json

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run example 01 (lease abstraction provenance)
        run: python examples/01_lease_abstraction_provenance/run.py
      - name: Run example 02 (tenant screening pre-flight)
        run: python examples/02_tenant_screening_preflight/run.py
      - name: Run example 03 (rent optimization sovereign veto)
        run: python examples/03_rent_optimization_sovereign_veto/run.py
